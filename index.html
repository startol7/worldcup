<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>WORLD CUP KNOCKOUT</title>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7080266964253063"
     crossorigin="anonymous"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700;800&family=JetBrains+Mono:wght@700&family=Mochiy+Pop+One&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
    font-family:'Hanken Grotesk','Hiragino Kaku Gothic ProN',sans-serif}
  html,body{height:100%;background:#06100a;overflow:hidden;user-select:none;touch-action:none}
  #wrap{height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;padding:8px}
  #stage{position:relative;width:min(480px,96vw);aspect-ratio:2/3;border-radius:16px;overflow:hidden;
    box-shadow:0 18px 50px rgba(0,0,0,.6)}
  canvas{display:block;width:100%;height:100%;cursor:crosshair}
  .pop{font-family:'Mochiy Pop One',sans-serif}

  /* ===== MATCH HUD ===== */
  #hud{position:absolute;top:0;left:0;right:0;display:none;flex-direction:column;gap:5px;padding:10px;
    pointer-events:none;color:#fff;z-index:6}
  #hud .scorerow{display:flex;align-items:center;justify-content:center;gap:9px}
  #hud .team{display:flex;align-items:center;gap:5px;font-weight:800;font-size:13px}
  #hud .team .fl{font-size:19px}
  #hud .s{font-family:'JetBrains Mono';font-size:29px;min-width:30px;text-align:center}
  #hud .dash{opacity:.55;font-size:21px}
  #hud .round{text-align:center;font-size:11px;font-weight:800;color:#ffe14d;letter-spacing:.06em}
  #hud .dots{display:flex;justify-content:center;gap:14px;margin-top:1px}
  #hud .dline{display:flex;gap:3px}
  #hud .dot{width:10px;height:10px;border-radius:50%;border:2px solid rgba(255,255,255,.5);background:transparent}
  #hud .dot.g{background:#43d17a;border-color:#43d17a}
  #hud .dot.x{background:#e0414e;border-color:#e0414e}
  #msg{position:absolute;top:40%;left:0;right:0;text-align:center;color:#fff;font-size:36px;font-weight:800;
    pointer-events:none;text-shadow:0 3px 12px rgba(0,0,0,.7);z-index:6}
  #hint{position:absolute;bottom:36px;left:0;right:0;text-align:center;color:rgba(255,255,255,.9);
    font-size:12px;font-weight:700;pointer-events:none;display:none;z-index:6;text-shadow:0 1px 4px rgba(0,0,0,.6)}
  #powerwrap{position:absolute;bottom:10px;left:8%;right:8%;height:18px;border-radius:9px;
    background:rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.45);display:none;z-index:6;overflow:hidden}
  #sweetzone{position:absolute;top:0;height:100%;background:rgba(67,209,122,.55);border-left:2px solid #43d17a;border-right:2px solid #43d17a}
  #powerbar{position:absolute;top:0;left:0;height:100%;width:0%;background:linear-gradient(90deg,#67e08a,#ffe14d,#ff7a3a,#e0414e)}

  /* overlays */
  .ov{position:absolute;inset:0;display:none;flex-direction:column;z-index:10}
  .ov.show{display:flex}

  .btn{border:0;cursor:pointer;font-weight:800;color:#fff;border-radius:14px;transition:transform .06s,box-shadow .06s;
    box-shadow:0 5px 0 rgba(0,0,0,.25),inset 0 2px 1px rgba(255,255,255,.4)}
  .btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.25),inset 0 2px 1px rgba(255,255,255,.35)}
  .btn.orange{background:linear-gradient(#ffb24f,#f2780f)}
  .btn.green{background:linear-gradient(#67c46a,#3a9e48)}
  .btn.gold{background:linear-gradient(#ffe27a,#f5b400);color:#5a3b00}

  /* ===== TITLE ===== */
  #title{background:radial-gradient(120% 80% at 50% 0%,#16623a 0%,#0c4a28 55%,#05311a 100%);align-items:center}
  .brand{position:absolute;top:10px;left:10px;background:#0a7a3c;color:#fff;font-size:10px;font-weight:800;
    padding:6px 9px;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,.25);line-height:1.3}
  .pitchstrip{position:absolute;bottom:0;left:0;right:0;height:120px;background:repeating-linear-gradient(90deg,#1f5f37 0 28px,#245f3a 28px 56px)}
  .pitchstrip::after{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:rgba(255,255,255,.4)}
  .logo{margin-top:46px;text-align:center;line-height:.9}
  .logo .l1{font-size:52px;color:#ffe14d;-webkit-text-stroke:5px #073a1f;paint-order:stroke;
    text-shadow:4px 5px 0 rgba(0,0,0,.3);transform:rotate(-3deg);display:inline-block}
  .logo .l2{font-size:52px;color:#ff7a3a;-webkit-text-stroke:5px #073a1f;paint-order:stroke;
    text-shadow:4px 5px 0 rgba(0,0,0,.3);transform:rotate(-2deg);display:inline-block;margin-top:-4px}
  .logo .sub{display:block;margin-top:6px;color:#bfe6c8;font-weight:800;letter-spacing:.22em;font-size:13px}
  .trophy{font-size:62px;margin-top:6px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}
  .namebox{margin-top:16px;display:flex;align-items:center;background:#fff;border-radius:12px;overflow:hidden;
    box-shadow:0 5px 16px rgba(0,0,0,.22);border:2px solid #073a1f;z-index:2}
  .namebox .lab{background:#0a7a3c;color:#fff;font-weight:800;font-size:13px;height:44px;display:grid;place-items:center;padding:0 12px}
  .namebox input{border:0;outline:0;font-size:18px;font-weight:700;color:#1b3a55;height:44px;padding:0 14px;width:190px}
  #title .acts{margin-top:14px;display:flex;flex-direction:column;gap:10px;align-items:center;z-index:2}
  #title .btn.orange{width:240px;height:56px;font-size:24px}

  /* ===== TEAM SELECT ===== */
  #select{background:linear-gradient(#dfeae2,#c7d8cd);padding:12px}
  .pshead{text-align:center;color:#0a7a3c;font-size:23px;font-weight:800;letter-spacing:.04em;margin:4px 0 8px;position:relative}
  .pshead::before,.pshead::after{content:"";position:absolute;top:50%;width:34px;height:3px;background:#0a7a3c}
  .pshead::before{left:8px}.pshead::after{right:8px}
  .psgrid{flex:1;display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:7px;overflow-y:auto;align-content:start;padding-bottom:4px}
  .tcard{border-radius:12px;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.14);border:2px solid rgba(0,0,0,.06);
    cursor:pointer;transition:transform .08s;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 3px;position:relative}
  .tcard:active{transform:scale(.95)}
  .tcard .fl{font-size:29px;line-height:1}
  .tcard .nm{font-weight:800;font-size:11px;color:#2b3743;text-align:center}
  .tcard .ty{font-size:11px}
  .tcard .str{display:flex;gap:1px;margin-top:1px}
  .tcard .str i{width:4px;height:4px;border-radius:50%;background:#f2b500}
  .tcard .str i.off{background:#d6dee4}
  .selnote{font-size:11px;color:#5a6a62;font-weight:700;text-align:center;padding:6px}

  /* ===== PLAYER TYPE SELECT ===== */
  #ptype{background:linear-gradient(#102a1c,#08301c);padding:14px;gap:9px;color:#fff}
  .ptgrid{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:10px}
  .ptcard{border-radius:16px;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.18);
    cursor:pointer;transition:transform .08s;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;padding:10px;text-align:center}
  .ptcard:active{transform:scale(.96)}
  .ptcard .e{font-size:40px}
  .ptcard .nm{font-weight:800;font-size:17px}
  .ptcard .d{font-size:11px;font-weight:700;color:#cdeecb;line-height:1.35}

  /* ===== AD ===== */
  #ad{background:rgba(6,16,10,.94);align-items:center;justify-content:center;gap:13px;color:#fff}
  #ad .top{font-size:13px;font-weight:700;letter-spacing:.05em;color:#cdeecb;z-index:2}
  #ad .vs{display:flex;align-items:center;gap:18px;z-index:2;font-weight:800}
  #ad .vs .t{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:14px}
  #ad .vs .t .fl{font-size:46px}
  #ad .vs .t .ty{font-size:11px;color:#cdeecb}
  #ad .vs .x{font-size:20px;color:#ffe14d}
  #ad .box{z-index:2;width:300px;height:200px;background:#fff;border-radius:10px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;color:#5a6a78;box-shadow:0 12px 40px rgba(0,0,0,.5)}
  #ad .box b{font-size:16px;color:#2b3743}
  #ad .box .ph{font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:800;color:#9aa6b0;margin-top:6px}
  #ad .box .gg{font-size:10px;color:#aeb8c0;margin-top:12px}
  #ad .btn.green{width:230px;height:52px;font-size:20px;z-index:2}

  /* ===== BRACKET ===== */
  #bracket{background:linear-gradient(#0c4a28,#05311a);padding:13px;gap:9px;color:#fff}
  .brkhead{text-align:center;font-size:21px;font-weight:800;color:#ffe14d;letter-spacing:.04em}
  .brkme{text-align:center;font-size:13px;font-weight:800;color:#bfe6c8}
  .rounds{flex:1;display:flex;flex-direction:column;gap:8px;justify-content:center}
  .rnd{background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.16);border-radius:12px;padding:9px 11px;
    display:flex;align-items:center;gap:9px}
  .rnd.cur{border-color:#ffe14d;background:rgba(255,225,77,.13);box-shadow:0 0 0 2px rgba(255,225,77,.22)}
  .rnd.done{opacity:.8}
  .rnd .rlbl{font-size:10px;font-weight:800;color:#bfe6c8;width:74px;line-height:1.2}
  .rnd .rlbl .diff{color:#ff9a3a}
  .rnd .opp{flex:1;display:flex;align-items:center;gap:6px;font-weight:800;font-size:15px}
  .rnd .opp .fl{font-size:21px}
  .rnd .opp .ty{font-size:13px;opacity:.9}
  .rnd .stt{font-size:12px;font-weight:800;font-family:'JetBrains Mono'}
  .rnd .stt.win{color:#43d17a}.rnd .stt.lose{color:#e0414e}.rnd .stt.wait{color:#9fb8a8}
  .sponsor{height:38px;border-radius:9px;border:1px dashed rgba(255,255,255,.3);display:grid;place-items:center;color:#cdeecb;font-size:10px;font-weight:800;letter-spacing:.06em}
  #bracket .btn{width:240px;height:52px;font-size:20px;align-self:center}

  /* ===== RESULT ===== */
  #result{background:rgba(5,16,10,.88);align-items:center;justify-content:center;gap:13px;color:#fff;text-align:center;padding:20px}
  #result .big{font-size:44px;font-weight:800}
  #result .tro{font-size:78px}
  #result .sc{font-family:'JetBrains Mono';font-size:23px;color:#cdd9e3}
  #result .sub{font-size:14px;color:#bfe6c8;font-weight:700;max-width:280px}
  #result .btn{width:230px;height:48px;font-size:18px}

  /* ===== RANKING ===== */
  #ranking{background:linear-gradient(#0c4a28,#05311a);padding:13px;gap:10px;color:#fff}
  .rkhead{text-align:center;font-size:22px;font-weight:800;color:#ffe14d;letter-spacing:.04em;margin-top:4px}
  .rksub{text-align:center;font-size:11px;color:#bfe6c8;font-weight:700;margin-top:-4px}
  .rklist{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:4px 2px}
  .rkrow{display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.14);
    border-radius:12px;padding:8px 10px}
  .rkrow.top{border-color:rgba(255,225,77,.5);background:rgba(255,225,77,.1)}
  .rkpos{width:34px;text-align:center;font-size:18px;font-weight:800;color:#ffe14d}
  .rkmain{flex:1;min-width:0}
  .rkname{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rkflags{font-size:14px;line-height:1.2;margin-top:1px;word-break:break-all}
  .rkstat{display:flex;flex-direction:column;align-items:center;width:44px}
  .rkstat b{font-size:18px;font-family:'JetBrains Mono';color:#43d17a;line-height:1}
  .rkstat span{font-size:9px;color:#bfe6c8;font-weight:700;margin-top:2px}
  .rkempty{text-align:center;color:#bfe6c8;font-weight:700;font-size:13px;padding:30px 12px;line-height:1.7}
  #ranking .btn{width:240px;height:50px;font-size:19px;align-self:center}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="c"></canvas>

    <!-- MATCH HUD -->
    <div id="hud">
      <div class="round" id="hRound">ベスト16</div>
      <div class="scorerow">
        <div class="team"><span class="fl" id="hYf">🏳️</span><span id="hYn">YOU</span></div>
        <div class="s" id="hYs">0</div><div class="dash">–</div><div class="s" id="hCs">0</div>
        <div class="team"><span id="hCn">CPU</span><span class="fl" id="hCf">🏳️</span></div>
      </div>
      <div class="dots"><div class="dline" id="hYd"></div><div class="dline" id="hCd"></div></div>
    </div>
    <div id="msg"></div>
    <div id="hint"></div>
    <div id="powerwrap"><div id="sweetzone"></div><div id="powerbar"></div></div>

    <!-- TITLE -->
    <div id="title" class="ov show">
      <div class="brand">ワールドカップ<br>KNOCKOUT</div>
      <div class="pitchstrip"></div>
      <div class="trophy">🏆</div>
      <div class="logo pop"><span class="l1">WORLD</span><span class="l2">CUP</span><span class="sub">KNOCKOUT</span></div>
      <div class="namebox"><div class="lab">NAME</div><input id="pname" maxlength="10" value="プレイヤー"></div>
      <div class="acts">
        <button class="btn orange pop" onclick="go('select')">大会へ挑戦！</button>
        <button class="btn green pop" onclick="showRanking()" style="width:240px;height:48px;font-size:18px">🏆 ランキング</button>
      </div>
    </div>

    <!-- TEAM SELECT -->
    <div id="select" class="ov">
      <div class="pshead pop">出場国をえらぶ</div>
      <div class="psgrid" id="psgrid"></div>
      <div class="selnote">実際の組み合わせで勝ち上がれ！ 例: 日本の初戦は 🇧🇷 ブラジル</div>
    </div>

    <!-- PLAYER TYPE SELECT -->
    <div id="ptype" class="ov">
      <div class="pshead pop" style="color:#ffe14d">選手タイプをえらぶ</div>
      <div class="ptgrid" id="ptgrid"></div>
    </div>

    <!-- AD -->
    <div id="ad" class="ov">
      <div class="top">スポンサー広告をご覧ください</div>
      <div class="vs" id="adVs"></div>
      <div class="box"><b>広告スペース</b><div class="ph">AdSense</div><div class="gg">Ads by Google（ここに広告）</div></div>
      <button class="btn green pop" onclick="startMatch()">▶ 試合開始</button>
    </div>

    <!-- BRACKET -->
    <div id="bracket" class="ov">
      <div class="brkhead pop">🏆 決勝トーナメント表</div>
      <div class="brkme" id="brkMe"></div>
      <div class="rounds" id="rounds"></div>
      <div class="sponsor">SPONSORED — 広告スペース（AdSense）</div>
      <button class="btn orange pop" id="koBtn" onclick="go('ad')">キックオフ！</button>
    </div>

    <!-- RESULT -->
    <div id="result" class="ov">
      <div class="tro" id="rTro"></div>
      <div class="big" id="rT">YOU WIN!</div>
      <div class="sc" id="rS">3 – 1</div>
      <div class="sub" id="rSub"></div>
      <button class="btn orange pop" id="rBtn1" onclick="nextStage()">次の試合へ</button>
      <button class="btn green" onclick="go('title')">タイトルへ</button>
    </div>

    <!-- RANKING -->
    <div id="ranking" class="ov">
      <div class="rkhead pop">🏆 オンラインランキング</div>
      <div class="rksub">制覇国数 → 総優勝回数 の順</div>
      <div class="rklist" id="rklist"></div>
      <button class="btn orange pop" onclick="go('title')">タイトルへ戻る</button>
    </div>
  </div>
  <div class="adbar">広告スペース（AdSense）</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* =========================================================================
   WORLD CUP KNOCKOUT — サッカー版PK対決トーナメント
   ・実在の組み合わせ（日本の初戦＝ブラジル 等）で勝ち上がる
   ・4種類の選手タイプ（あなたも相手も能力を持つ）
   ・キックメーター(緑のスイートスポットで離すと正確＆強い)
   ・キーパーは実際のPKのように左右へ跳ぶ→真ん中シュートも有効
   ・決勝に近づくほど難易度UP
   ========================================================================= */

/* ---- three.js ---- */
const stage=document.getElementById('stage'),cv=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true});
renderer.setPixelRatio(Math.min(2,devicePixelRatio));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=0.92;
const scene=new THREE.Scene();
scene.background=new THREE.Color('#16344c');scene.fog=new THREE.Fog('#16344c',55,110);
const cam=new THREE.PerspectiveCamera(46,2/3,0.1,300);
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();}
window.addEventListener('resize',resize);
scene.add(new THREE.HemisphereLight('#9fc0e0','#1d3a2c',0.5));
scene.add(new THREE.AmbientLight('#ffffff',0.12));
const sun=new THREE.DirectionalLight('#fff3d6',1.05);sun.position.set(-9,26,15);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-24;sun.shadow.camera.right=24;
sun.shadow.camera.top=28;sun.shadow.camera.bottom=-28;sun.shadow.camera.near=1;sun.shadow.camera.far=80;sun.shadow.bias=-0.0004;scene.add(sun);
const fill=new THREE.DirectionalLight('#cfe4ff',0.35);fill.position.set(6,14,20);scene.add(fill);

/* ---- 寸法 ---- */
const GZ=-15, SPOT=6, GOAL_HALF=4.0, GOAL_H=3.0, KEEP_X=3.55;

function pitchTexture(){const cn=document.createElement('canvas');cn.width=512;cn.height=1024;const g=cn.getContext('2d');
  for(let i=0;i<16;i++){g.fillStyle=i%2?'#206239':'#235f3a';g.fillRect(0,i*64,512,64);}
  g.strokeStyle='rgba(255,255,255,.72)';g.lineWidth=6;
  g.strokeRect(40,40,432,944);
  g.beginPath();g.moveTo(40,512);g.lineTo(472,512);g.stroke();
  g.beginPath();g.arc(256,512,70,0,7);g.stroke();
  g.fillStyle='rgba(255,255,255,.72)';g.beginPath();g.arc(256,512,7,0,7);g.fill();
  g.strokeRect(130,40,252,150);g.strokeRect(196,40,120,60);g.beginPath();g.arc(256,170,8,0,7);g.fill();
  g.strokeRect(130,834,252,150);g.strokeRect(196,924,120,60);g.beginPath();g.arc(256,854,8,0,7);g.fill();
  const t=new THREE.CanvasTexture(cn);t.anisotropy=4;return t;}
const ground=new THREE.Mesh(new THREE.PlaneGeometry(20,46),new THREE.MeshStandardMaterial({map:pitchTexture(),roughness:.97}));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const ring=new THREE.Mesh(new THREE.CylinderGeometry(30,30,9,44,1,true),new THREE.MeshStandardMaterial({color:'#0d1d2b',side:THREE.BackSide,roughness:1}));ring.position.y=4.5;scene.add(ring);

function buildGoal(){const grp=new THREE.Group();const post=new THREE.MeshStandardMaterial({color:'#f2f2f2',roughness:.5});
  const pl=new THREE.Mesh(new THREE.CylinderGeometry(0.13,0.13,GOAL_H,12),post);pl.position.set(-GOAL_HALF,GOAL_H/2,GZ);pl.castShadow=true;grp.add(pl);
  const pr=pl.clone();pr.position.x=GOAL_HALF;grp.add(pr);
  const bar=new THREE.Mesh(new THREE.CylinderGeometry(0.13,0.13,GOAL_HALF*2,12),post);bar.rotation.z=Math.PI/2;bar.position.set(0,GOAL_H,GZ);bar.castShadow=true;grp.add(bar);
  const netMat=new THREE.MeshStandardMaterial({color:'#dfeaf2',transparent:true,opacity:.14,side:THREE.DoubleSide,wireframe:true});
  const back=new THREE.Mesh(new THREE.PlaneGeometry(GOAL_HALF*2,GOAL_H,12,7),netMat);back.position.set(0,GOAL_H/2,GZ-1.4);grp.add(back);
  const top=new THREE.Mesh(new THREE.PlaneGeometry(GOAL_HALF*2,1.5,12,4),netMat);top.rotation.x=-Math.PI/2;top.position.set(0,GOAL_H,GZ-0.75);grp.add(top);
  return grp;}
scene.add(buildGoal());

/* ---- キャラ ---- */
function chibi(outfit,hair,skin){const g=new THREE.Group();
  const m=(c,r)=>new THREE.MeshStandardMaterial({color:c,roughness:r==null?.7:r});
  const OUT=m(outfit,.42),SKIN=m(skin||'#f0c9a0',.75),HAIR=m(hair||'#3a2a1a',.55),DARK=m('#222',.5);

function cpuShoot(){
  // 相手の選手タイプ＋難易度でコースとパワーが変化
  const corner=Math.random()<(0.42+0.12*diff+oppTrait.acc*0.4);
  const side=Math.random()<0.5?-1:1;
  const tx= corner ? side*GOAL_HALF*(0.55+Math.random()*0.4)
                   : side*GOAL_HALF*Math.random()*0.35;       // たまに真ん中も狙う
  const ty=0.7+Math.random()*(1.3+1.0*(0.4+0.15*diff+oppTrait.acc*0.3));
  const p=Math.min(1,0.5+Math.random()*0.4+0.12*diff);
  shootBall(tx,ty,p,'cpu',true);
  $('hint').textContent='セーブ！';msg('','#fff');
}

function shootBall(tx,ty,p,who,sweet){
  const ct=(who==='you')?trait:oppTrait;
  let T=Math.round((46-18*p)*ct.shotMul);T=Math.max(16,T);
  resetBall();B.live=true;B.prevZ=B.z;
  B.vx=(tx-B.x)/T;B.vz=(GZ-B.z)/T;B.vy=(ty-B.y+0.5*G*T*T)/T;
  B.tgt={x:tx,y:ty};
  if(ct.curve>0){B.curveAmt=ct.curve*(tx>=0?-1:1)*0.9;}
  lastSweet=!!sweet;
  state='fly';beep(170,.12,'square',.1);shooter.position.x=0;
  if(who==='you')keeperDecide(tx,ty);
}

/* CPUキーパーの読み（実際のPKのように左右/中央のゾーンへ跳ぶ） */
function keeperDecide(tx,ty){
  const readP=0.20+0.11*diff+(opp.gk-0.80)*1.0+oppTrait.saveR*0.10;
  let z;
  if(Math.random()<readP){ z=Math.abs(tx)<1.2?0:Math.sign(tx); }       // 読み勝ち
  else{ const r=Math.random(); z=r<0.40?-1:(r<0.80?1:0); }             // 山勘（左/右/稀に中央）
  kpr.zone=z; kpr.tx=z*GOAL_HALF*0.62; kpr.dive=ty>2.0?1:0;
}

/* 入力 */
function ptr(e){const r=cv.getBoundingClientRect();
  return {nx:((e.clientX-r.left)/r.width)*2-1, ny:(e.clientY-r.top)/r.height};}
cv.addEventListener('pointermove',e=>{const{nx,ny}=ptr(e);
  if(state==='attack_aim'){aim.x=Math.max(-GOAL_HALF-0.4,Math.min(GOAL_HALF+0.4,nx*(GOAL_HALF+1.0)));
    aim.y=Math.max(0.3,Math.min(GOAL_H+0.3,(1-ny)*GOAL_H*1.25));}
  if(state==='defend'||(state==='fly'&&phase==='cpu')){kpr.tx=Math.max(-KEEP_X,Math.min(KEEP_X,nx*KEEP_X*1.3));}});
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture&&cv.setPointerCapture(e.pointerId);
  try{AC=AC||new(window.AudioContext||webkitAudioContext)();}catch(_){}
  const{nx,ny}=ptr(e);
  if(state==='attack_aim'){aim.x=Math.max(-GOAL_HALF-0.4,Math.min(GOAL_HALF+0.4,nx*(GOAL_HALF+1.0)));
    aim.y=Math.max(0.3,Math.min(GOAL_H+0.3,(1-ny)*GOAL_H*1.25));power=0;pdir=1;charging=true;}
  if(state==='defend'||(state==='fly'&&phase==='cpu')){kpr.tx=Math.max(-KEEP_X,Math.min(KEEP_X,nx*KEEP_X*1.3));}});
cv.addEventListener('pointerup',()=>{
  if(state==='attack_aim'&&charging){charging=false;
    const inSweet=Math.abs(power-0.84)<=trait.sweet;
    let err=inSweet?0.04:Math.abs(power-0.84)*2.4;err*=(1-trait.acc*0.7);
    const ex=(Math.random()-0.5)*err*GOAL_HALF, ey=(Math.random()-0.5)*err*GOAL_H*0.7;
    const tx=aim.x+ex, ty=Math.max(0.3,aim.y+ey);
    aimRing.visible=false;$('hint').style.display='none';
    shootBall(tx,ty,Math.max(0.18,power),'you',inSweet);
  }});

/* 判定 */
function resolveKick(){
  resolved=true;B.live=false;
  const bx=B.x,by=B.y;
  const onTarget=Math.abs(bx)<=GOAL_HALF-0.05 && by<=GOAL_H-0.05 && by>=0.0;
  let goal=false,label='',col='#fff';
  if(phase==='you'){
    if(!onTarget){goal=false;label='MISS…';col='#ff9a3a';}
    else{
      const sz=bx<-1.2?-1:(bx>1.2?1:0), kz=kpr.zone;
      if(kz===sz){ // 読まれた→球質(上スミ/パワー/カーブ)で破る
        let beat=0.16 + (by>2.3?0.34:(by>1.8?0.12:0))*(sz===0?0.5:1)
                 + (power>0.85&&lastSweet?0.14:0) + (trait.curve>0&&lastSweet?0.12:0)
                 - oppTrait.saveR*0.18 - 0.04*diff;
        beat=Math.max(0.03,Math.min(0.92,beat));
        goal=Math.random()<beat;
      }else{ // 逆を突いた
        goal=!(Math.abs(kz-sz)===1 && Math.random()<0.08);
      }
      if(goal){label='ゴール!! ⚽';col='#43d17a';shakeT=12;}
      else{label='ナイスセーブ!';col='#9fd8ff';kpr.jump=0.5;}
    }
    yk++;if(goal){yg++;yResults.push('g');cheer();}else{yResults.push('x');beep(150,.2,'sawtooth',.08);}
  }else{
    if(!onTarget){goal=false;label='枠外! 助かった';col='#9fd8ff';}
    else{
      let reach=1.7+trait.saveR;
      if(by>2.5)reach-=0.5;
      const dist=Math.abs(bx-kpr.x);
      if(dist<reach){goal=false;label='ビッグセーブ!! 🧤';col='#43d17a';kpr.jump=0.6;shakeT=10;cheer();}
      else{goal=true;label='失点…';col='#ff7a6b';shakeT=8;}
    }
    ck++;if(goal){cg++;cResults.push('g');beep(150,.2,'sawtooth',.08);}else{cResults.push('x');}
  }
  msg(label,col);updScore();
  setTimeout(afterKick,1200);
}
function afterKick(){const res=checkDecision();if(res){endMatch(res);return;}
  if(phase==='you')beginTheirKick();else beginYourKick();}

function checkDecision(){
  if(!sudden){
    const maxY=yg+(5-yk),maxC=cg+(5-ck);
    if(cg>maxY)return 'lose';
    if(yg>maxC)return 'win';
    if(yk>=5&&ck>=5){if(yg>cg)return 'win';if(cg>yg)return 'lose';sudden=true;}
    return null;
  }else{if(yk===ck&&yk>=5){if(yg>cg)return 'win';if(cg>yg)return 'lose';}return null;}
}

function endMatch(res){
  state='over';$('hud').style.display='none';$('hint').style.display='none';$('powerwrap').style.display='none';aimRing.visible=false;
  whistle();const me=TEAMS[myTeam];
  $('rS').textContent=`${yg} – ${cg}  (PK)`;
  if(res==='win'){
    if(stageIdx>=3){
      $('rTro').textContent='🏆';$('rT').textContent='WORLD CHAMPION!';$('rT').style.color='#ffe14d';
      $('rSub').textContent=`${me.f} ${me.n} が世界の頂点に！ おめでとう！`;
      $('rBtn1').textContent='もう一度挑戦';$('rBtn1').setAttribute('data-act','restart');
      registerChampion($('pname').value, myTeam);
      cheer();setTimeout(cheer,400);setTimeout(cheer,800);
    }else{
      $('rTro').textContent='✅';$('rT').textContent='勝利！突破！';$('rT').style.color='#43d17a';
      $('rSub').textContent=`${ROUND_NAMES[stageIdx]}突破！ 次は ${ROUND_NAMES[stageIdx+1]} だ。`;
      $('rBtn1').textContent='次の試合へ';$('rBtn1').setAttribute('data-act','advance');cheer();
    }
  }else{
    $('rTro').textContent='😢';$('rT').textContent='敗退…';$('rT').style.color='#ff7a6b';
    $('rSub').textContent=`${ROUND_NAMES[stageIdx]}で敗退。 ${opp.f} ${opp.n} に屈した。`;
    $('rBtn1').textContent='再挑戦';$('rBtn1').setAttribute('data-act','restart');
  }
  $('result').classList.add('show');
}
function nextStage(){const act=$('rBtn1').getAttribute('data-act');$('result').classList.remove('show');
  if(act==='advance'){stageIdx++;go('bracket');}else{go('select');}}

/* ループ */
const clock=new THREE.Clock();
function tick(){const dt=Math.min(0.05,clock.getDelta());
  if(charging){power+=pdir*trait.charge;if(power>=1){power=1;pdir=-1;}if(power<=0){power=0;pdir=1;}}
  $('powerbar').style.width=(power*100).toFixed(0)+'%';

  const ksp=(phase==='you')?0.16+0.03*diff:0.30+trait.saveS;
  kpr.x+=(kpr.tx-kpr.x)*ksp;kpr.x=Math.max(-KEEP_X,Math.min(KEEP_X,kpr.x));
  kpr.jump+=(0-kpr.jump)*0.12;
  const kSpeed=Math.abs(kpr.tx-kpr.x);
  keeper.position.set(kpr.x,kpr.jump,GZ+0.6);
  keeper.rotation.z=(kpr.tx-kpr.x)*0.28;
  const lean=Math.min(1,Math.abs(kpr.x)/KEEP_X+kpr.jump);
  keeper.userData.armL.rotation.z=1.2+lean*0.4;keeper.userData.armR.rotation.z=-1.2-lean*0.4;

  if(state==='fly'&&B.live&&!resolved){
    B.prevZ=B.z;B.x+=B.vx;B.y+=B.vy;B.z+=B.vz;B.vy-=G;if(B.y<0.05)B.y=0.05;
    if(B.z<=GZ){const t=(GZ-B.prevZ)/((B.z-B.prevZ)||1);B.x=B.x-B.vx*(1-t);B.y=B.y-(B.vy+G)*(1-t);resolveKick();}
  }

  let curveOff=0;
  if(B.curveAmt&&state==='fly'){const prog=Math.max(0,Math.min(1,(SPOT-B.z)/(SPOT-GZ)));curveOff=B.curveAmt*Math.sin(prog*Math.PI);}
  ball.position.set(B.x+curveOff,B.y+0.32,B.z);ball.rotation.x+=0.25;ball.rotation.y+=0.18;
  bshadow.position.set(B.x+curveOff,0.02,B.z);const ss=Math.max(0.4,1-B.y*.06);bshadow.scale.set(ss,ss,ss);
  if(aimRing.visible){aimRing.position.set(aim.x,aim.y,GZ+0.05);aimRing.lookAt(cam.position);
    aimRing.material.color.set(power>0.85?'#e0414e':(Math.abs(power-0.84)<=trait.sweet?'#43d17a':'#ffe14d'));}
  shooter.position.x+=(0-shooter.position.x)*0.2;
  animRun(shooter,0,dt);animRun(keeper,kSpeed,dt);

  let sx=0,sy=0;if(shakeT>0){shakeT--;sx=(Math.random()-.5)*.35*shakeT/12;sy=(Math.random()-.5)*.35*shakeT/12;}
  cam.position.set(sx,8.5+sy,17);cam.lookAt(0,2.4,-6);

  if(msgT>0){msgT--;$('msg').style.opacity=Math.min(1,msgT/30);$('msg').style.color=msgCol;}else $('msg').style.opacity=0;
  renderer.render(scene,cam);requestAnimationFrame(tick);}

resize();buildSelect();tick();
</script>
